# Deployment for BambuBuddy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bambuddy-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bambuddy
  template:
    metadata:
      labels:
        app: bambuddy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bambuddy-ct
          image: maziggy/bambuddy:latest
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          volumeMounts:
            - name: bambuddy-pvc           
              mountPath: /app/data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: bambuddy-pvc              
          persistentVolumeClaim:
            claimName: bambuddy-pvc

---
# Deployment for the OrcaSlicer sidecar (server-side slicing for BambuBuddy)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orca-slicer-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orca-slicer-api
  template:
    metadata:
      labels:
        app: orca-slicer-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: orca-slicer-api-ct
          image: ghcr.io/maziggy/orca-slicer-api:latest
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          volumeMounts:
            - name: orcaslicer-pvc
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: orcaslicer-pvc
          persistentVolumeClaim:
            claimName: orcaslicer-pvc


