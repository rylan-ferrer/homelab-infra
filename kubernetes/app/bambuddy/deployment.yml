# Deployment for BambuBuddy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bambuddy-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bambuddy
  template:
    metadata:
      annotations:
        trivy.aquasecurity.github.io/ignore: "KSV012,KSV013"
      labels:
        app: bambuddy
    spec:
      containers:
        - name: bambuddy-ct
          image: maziggy/bambuddy:latest
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          volumeMounts:
            - name: bambuddy-pvc           
              mountPath: /app/data
      volumes:
        - name: bambuddy-pvc              
          persistentVolumeClaim:
            claimName: bambuddy-pvc

---
# Deployment for the Bambu Studio sidecar (server-side slicing for BambuBuddy)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bambustudio-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bambustudio-api
  template:
    metadata:
      annotations:
        trivy.aquasecurity.github.io/ignore: "KSV012,KSV013"
      labels:
        app: bambustudio-api
    spec:
      containers:
        - name: bambustudio-api-ct
          image: ghcr.io/maziggy/bambu-studio-api
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          volumeMounts:
            - name: bambustudio-pvc
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: bambustudio-pvc
          persistentVolumeClaim:
            claimName: bambustudio-pvc


