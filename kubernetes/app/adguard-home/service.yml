apiVersion: v1
kind: Service
metadata:
  name: adguard-home
  namespace: adguard-home
  annotations:
    metallb.io/loadBalancerIPs: 192.168.0.213
spec:
  selector:
    app: adguard-home
  type: LoadBalancer
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: web
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: http-tcp
      port: 80
      targetPort: 80
      protocol: TCP