apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-app
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: jellyfin-ct
          image: jellyfin/jellyfin:2026072708
          ports:
            - containerPort: 8096
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: jellyfin-pvc           
              mountPath: /config       
            - name: jellyfin-cache
              mountPath: /cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: jellyfin-pvc              
          persistentVolumeClaim:
            claimName: jellyfin-pvc
        - name: jellyfin-cache
          emptyDir: {}