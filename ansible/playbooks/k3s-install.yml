- name: Install OS dependencies
  hosts: all
  become: true
  tasks:
    - name: Install nfs-common for Kubernetes PV mounts
      apt:
        name: nfs-common
        state: present
        update_cache: yes
        
- name: Initialize first control-plane node
  hosts: k3s-cp-1
  become: true
  tasks:
    - name: Install k3s as cluster-init server
      shell: |
        curl -sfL https://get.k3s.io | sh -s - server --cluster-init
      args:
        creates: /etc/rancher/k3s/k3s.yaml
    
    - name: Read the cluster join token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_raw

- name: Deploy cert-manager CRDs and controller
  ansible.builtin.command:
    cmd: kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.1/cert-manager.yaml
  changed_when: true

- name: Wait for cert-manager webhook to become available
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/cert-manager-webhook -n cert-manager --timeout=60s
  changed_when: false

- name: Create Cloudflare API token secret
  ansible.builtin.command:
    cmd: >
      kubectl create secret generic cloudflare-api-token-secret
      --namespace cert-manager
      --from-literal=api-token={{ cloudflare_api_token }}
      --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true

- name: Apply Let's Encrypt ClusterIssuer
  ansible.builtin.command:
    cmd: |
      cat <<EOF | kubectl apply -f -
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-prod
      spec:
        acme:
          email: {{ acme_email }}
          server: https://acme-v02.api.letsencrypt.org/directory
          privateKeySecretRef:
            name: letsencrypt-prod-account-key
          solvers:
            - dns01:
                cloudflare:
                  apiTokenSecretRef:
                    name: cloudflare-api-token-secret
                    key: api-token
      EOF
  changed_when: true

- name: Join remaining control-plane nodes
  hosts: k3s-cp-2:k3s-cp-3
  become: true
  vars:
    k3s_url: "https://{{ hostvars['k3s-cp-1']['ansible_host'] }}:6443"
    k3s_token: "{{ hostvars['k3s-cp-1']['node_token_raw']['content'] | b64decode | trim }}"
  tasks:
    - name: Join as additional control-plane node
      shell: |
        curl -sfL https://get.k3s.io | sh -s - server --server {{ k3s_url }} --token {{ k3s_token }}
      args:
        creates: /etc/rancher/k3s/k3s.yaml

- name: Join worker nodes
  hosts: workers
  become: true
  vars:
    k3s_url: "https://{{ hostvars['k3s-cp-1']['ansible_host'] }}:6443"
    k3s_token: "{{ hostvars['k3s-cp-1']['node_token_raw']['content'] | b64decode | trim }}"
  tasks:
    - name: Join as worker node
      shell: |
        curl -sfL https://get.k3s.io | sh -s - agent --server {{ k3s_url }} --token {{ k3s_token }}
      args:
        creates: /etc/rancher/k3s/agent

- name: Disable k3s built-in ServiceLB
  hosts: control_plane
  become: true
  serial: 1
  tasks:
    - name: Write k3s config
      copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          disable:
            - servicelb
          tls-san:
            - "192.168.0.211"

    - name: Restart k3s to apply config
      systemd:
        name: k3s
        state: restarted

- name: Deploy MetalLB
  hosts: k3s-cp-1
  become: true
  tasks:
    - name: Copy MetalLB manifest to control-plane node
      copy:
        src: "{{ playbook_dir }}/../../metallb/metallb.yml"
        dest: /tmp/metallb.yml
    
    - name: Install MetalLB controller and CRDs
      shell: "k3s kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml"
      register: metallb_install_result
      changed_when: "'unchanged' not in metallb_install_result.stdout"

    - name: Wait for MetalLB controller to be ready
      shell: "k3s kubectl wait --namespace metallb-system --for=condition=ready pod --selector=app=metallb --timeout=90s"

    - name: Apply MetalLB manifest
      shell: "k3s kubectl apply -f /tmp/metallb.yml"
      register: metallb_result
      changed_when: "'unchanged' not in metallb_result.stdout"

    - name: Copy kube-vip manifest to control-plane node
      copy:
        src: "{{ playbook_dir }}/../../kube-vip/kube-vip.yml"
        dest: /tmp/kube-vip.yml

    - name: Apply kube-vip manifest
      shell: "k3s kubectl apply -f /tmp/kube-vip.yml"
      register: kubevip_result
      changed_when: "'unchanged' not in kubevip_result.stdout"

- name: Install and connect Tailscale on all nodes
  hosts: all
  become: true
  tasks:
    - name: Add Tailscale's official install script
      shell: curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale

    - name: Bring up Tailscale
      shell: "tailscale up --authkey={{ vault_tailscale_authkey }} --ssh"
      register: ts_result
      changed_when: "'Success' in ts_result.stdout"