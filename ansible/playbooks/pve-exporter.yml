---
- name: 🚀 Deploy Prometheus PVE Exporter
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig_path: "~/.kube/config"

  tasks:
    - name: 📁 Ensure monitoring namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: monitoring

    - name: 🔐 Create PVE Exporter secret configuration
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: pve-exporter-config
            namespace: monitoring
          type: Opaque
          stringData:
            pve.yml: |
              default:
                user: "{{ vault_pve_exporter_user }}"
                token_name: "{{ vault_pve_exporter_token_name }}"
                token_value: "{{ vault_pve_exporter_token_value }}"
                verify_ssl: false

    - name: 📦 Deploy PVE Exporter Deployment and Service
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: "../../pve-exporter/pve-exporter.yml"