# This is a PersistentVolumeClaim for Orca Slicer.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orcaslicer-pvc
  namespace: default
spec:
  storageClassName: nfs-client
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi

---

# Deployment for the OrcaSlicer sidecar (server-side slicing for BambuBuddy)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orca-slicer-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orca-slicer-api
  template:
    metadata:
      labels:
        app: orca-slicer-api
    spec:
      containers:
        - name: orca-slicer-api-ct
          image: ghcr.io/maziggy/orca-slicer-api:latest
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          volumeMounts:
            - name: orcaslicer-pvc
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: orcaslicer-pvc
          persistentVolumeClaim:
            claimName: orcaslicer-pvc

---
# ClusterIP Service - internal only, Bambuddy talks to this pod-to-pod
apiVersion: v1
kind: Service
metadata:
  name: orca-slicer-api-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: orca-slicer-api
  ports:
    - port: 3003
      targetPort: 3000
      name: http
      protocol: TCP